<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofprint · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#FAF9F6;--panel:#fff;--ink:#1C1A17;--ink2:#6C6860;--line:#EAE6DE;--accent:#C96442;
        --pass:#1E7A47;--pass-bg:#E7F2EB;--warn:#B26B0C;--warn-bg:#F8EEDA;--fail:#C13B2C;--fail-bg:#FAE7E3;--video:#2E44E6;--gyro:#C96442}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 24px 70px}
  body.casting .wrap{max-width:1600px;display:grid;grid-template-columns:1fr 400px;gap:28px;align-items:start}
  body.casting header{grid-column:1/-1}
  .cast{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer}
  .cast.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* the phone: a black rounded frame, sticky, keeps the iPhone aspect */
  .phone{position:sticky;top:20px;background:#0c0c0d;border-radius:44px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);aspect-ratio:9/19.5;display:flex;flex-direction:column;overflow:hidden}
  .phone canvas{width:100%;height:100%;object-fit:contain;border-radius:32px;background:#000;display:block}
  .phone .off{position:absolute;top:22px;right:22px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer}
  .phone .msg{position:absolute;inset:0;display:grid;place-items:center;color:#9AA1AC;font-size:13px;text-align:center;padding:30px}
  header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
  h2{font-size:11.5px;margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .tabs{display:flex;gap:4px;background:#EEEBE4;border-radius:12px;padding:4px}
  .tabs button{font:inherit;font-weight:600;border:0;background:transparent;border-radius:9px;padding:7px 16px;cursor:pointer;color:var(--ink2)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .mono{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .muted{color:var(--ink2)}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;margin-left:auto}.live b{width:8px;height:8px;border-radius:50%;background:var(--pass);display:inline-block}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  @media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi .n{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1}
  .kpi .l{color:var(--ink2);font-size:13px;margin-top:4px}
  .mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:800;color:#fff;line-height:1;vertical-align:middle}
  .mk.ok{background:var(--pass)} .mk.warn{background:var(--warn)} .mk.bad{background:var(--fail)} .mk.off{background:#D5D8D3;color:#fff}
  .res{display:inline-flex;align-items:center;gap:8px;font-weight:600}
  .naive{color:var(--fail);font-weight:700}
  .checks{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;align-items:center}
  .checks .name{font-weight:600}
  .bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:#EEF0EC}
  .bar i{display:flex;align-items:center;justify-content:center;height:100%;font-style:normal;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
  .bar-legend{font-size:12px;color:var(--ink2)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--ink2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  tbody tr{cursor:pointer} tbody tr:hover td{background:#F7F5F0}
  .empty{color:var(--ink2);padding:40px;text-align:center}
  .pp-empty{color:var(--ink2);padding:22px;text-align:center;font-size:13px;background:#FAFAF8;border-radius:10px}
  /* run view */
  .back{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600}
  .banner{display:flex;align-items:center;gap:22px;border-radius:16px;padding:20px 24px;margin:14px 0}
  .banner.pass{background:var(--pass-bg);color:var(--pass)}.banner.step_up{background:var(--warn-bg);color:var(--warn)}.banner.block{background:var(--fail-bg);color:var(--fail)}
  .banner .big{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.1}
  .banner ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:inherit;opacity:.9}
  .banner .meta{margin-left:auto;text-align:right;font-size:12.5px;opacity:.85;white-space:nowrap}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.cards{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
  .card.wide{grid-column:1/-1}
  .card .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .card .head .t{font-weight:700;font-size:15px}
  .card .head .s{color:var(--ink2);font-size:12.5px}
  .card .head .pill{margin-left:auto}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 18px;font-size:13.5px}
  .facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0}
  .facts span:first-child{color:var(--ink2)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:4px 0 6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:860px){.two{grid-template-columns:1fr}}
  .note{color:var(--ink2);font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Proofprint</h1>
    <div class="tabs"><button class="on" data-tab="summary">Summary</button><button data-tab="sessions">Sessions</button></div>
    <span style="flex:1"></span>
    <button class="cast" id="cast" title="Show the phone screen on the right (USB + QuickTime, or AirPlay to this Mac)">Cast phone</button>
  </header>

  <div id="empty" class="empty">No verifications yet.</div>

  <!-- SUMMARY -->
  <section id="tab-summary" hidden>
    <div class="kpis">
      <div class="panel kpi"><div class="n" id="kN">0</div><div class="l">verifications</div></div>
      <div class="panel kpi"><div class="n" style="color:var(--pass)" id="kPass">0</div><div class="l">verified <span class="mono" id="kPassPct"></span></div></div>
      <div class="panel kpi"><div class="n" style="color:var(--warn)" id="kStep">0</div><div class="l">sent to a second check <span class="mono" id="kStepPct"></span></div></div>
      <div class="panel kpi"><div class="n" style="color:var(--fail)" id="kBlock">0</div><div class="l">blocked <span class="mono" id="kBlockPct"></span></div></div>
    </div>
    <div class="panel">
      <h2>Results</h2>
      <div class="checks" id="checks"></div>
    </div>
  </section>

  <!-- SESSIONS -->
  <section id="tab-sessions" hidden>
    <div class="panel" id="listPanel" style="padding:6px 8px">
      <div style="overflow:auto"><table><thead><tr>
        <th>when</th><th>who</th><th>result</th><th>document</th><th>face</th><th>light</th><th>phone move</th><th>profile turn</th><th>app</th>
      </tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div id="run" hidden>
      <button class="back" id="back">← All sessions</button>
      <div class="banner" id="banner"></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <aside class="phone" id="phone" hidden>
    <video id="phoneVideo" autoplay muted playsinline hidden></video>
    <canvas id="phoneCanvas"></canvas>
    <div class="msg" id="phoneMsg" hidden></div>
    <button class="off" id="castStop" title="Stop">✕</button>
  </aside>
</div>

<script src="/web/charts.js"></script>
<script>
const $ = id => document.getElementById(id);
const P = PPCharts, fmt = P.fmt;
const FACE_T = { low: 0.28, match: 0.363 };
let rows = [], lastN = -1, tab = "summary", openId = null;

// Every status in the app collapses to one of four marks: ✓ passed · ~ unclear · ✗ failed · – not run
const STATE = { pass:"ok", match:"ok", clean:"ok", ok:"ok", step_up:"warn", review:"warn", insufficient:"warn", skipped:"warn", flagged:"warn",
                block:"bad", fail:"bad", mismatch:"bad", absent:"off", off:"off", none:"off" };
const SYM = { ok:"✓", warn:"~", bad:"✗", off:"–" }, WORD = { ok:"passed", warn:"unclear", bad:"failed", off:"not run" };
const stateOf = v => v == null ? "off" : (STATE[v] || "warn");
const mark = v => { const st = stateOf(v); return `<span class="mk ${st}" title="${WORD[st]}${v && v !== st ? " (" + v + ")" : ""}">${SYM[st]}</span>`; };
const RESULT = { pass:"Verified", step_up:"Second check", block:"Blocked" };
const result = v => `<span class="res">${mark(v)}${RESULT[v] || v || "—"}</span>`;
const LABEL = WORD;
const when = s => (s || "").replace("T", " ").replace("+00:00", "");
const pct = (n, t) => t ? `${Math.round(100 * n / t)} %` : "";
const facts = obj => `<div class="facts">${Object.entries(obj).filter(([, v]) => v != null && v !== "").map(([k, v]) => `<div><span>${k}</span><span class="mono">${v}</span></div>`).join("")}</div>`;
const flags = a => (a && a.length) ? a.join(", ") : "none";

// ---- tabs ----
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); showTab(); });
function showTab(){ $("tab-summary").hidden = tab !== "summary" || !rows.length; $("tab-sessions").hidden = tab !== "sessions" || !rows.length; }

// ---- summary ----
function checkBar(counts){
  const good = ["pass", "match", "clean"], mid = ["review", "insufficient", "skipped", "flagged"], bad = ["fail", "mismatch"];
  const sum = ks => ks.reduce((s, k) => s + (counts[k] || 0), 0);
  const g = sum(good), m = sum(mid), b = sum(bad), o = Object.entries(counts).filter(([k]) => ![...good, ...mid, ...bad].includes(k)).reduce((s, [, v]) => s + v, 0);
  const t = g + m + b + o || 1;
  const seg = (n, col) => n ? `<i style="width:${100 * n / t}%;background:${col}">${n}</i>` : "";
  return `<div class="bar">${seg(g, "var(--pass)")}${seg(m, "var(--warn)")}${seg(b, "var(--fail)")}${seg(o, "#C9CDC9")}</div>`;
}
function renderSummary(s){
  const bd = s.by_decision || {}, n = s.n || 0;
  $("kN").textContent = n;
  $("kPass").textContent = bd.pass || 0; $("kPassPct").textContent = pct(bd.pass || 0, n);
  $("kStep").textContent = bd.step_up || 0; $("kStepPct").textContent = pct(bd.step_up || 0, n);
  $("kBlock").textContent = bd.block || 0; $("kBlockPct").textContent = pct(bd.block || 0, n);
  const ch = s.checks || {};
  $("checks").innerHTML = [["Face match", "face"], ["Capture integrity", "integrity"], ["Light", "light"], ["Phone move", "motion"], ["Profile turn", "profile"]]
    .map(([name, k]) => `<span class="name">${name}</span>${checkBar(ch[k] || {})}`).join("");
}

// ---- sessions list ----
function renderRows(){
  $("rows").innerHTML = rows.map(r => `<tr data-id="${r.session_id}">
    <td class="mono">${when(r.created_at)}</td><td>${r.first_name || "—"}</td><td>${result(r.decision)}</td>
    <td>${mark(r.id_flags?.length ? "flagged" : (r.doc_type ? "ok" : null))}</td>
    <td>${mark(r.face_verdict)}</td>
    <td>${mark(r.light_verdict)}</td>
    <td>${mark(r.motion_verdict)}</td>
    <td>${mark(r.profile_verdict)}</td>
    <td>${r.mode === "naive" ? '<span class="naive">naïve</span>' : 'Proofprint'}</td></tr>`).join("");
  $("rows").querySelectorAll("tr").forEach(tr => tr.onclick = () => openRun(tr.dataset.id));
}

// ---- one run ----
const card = (title, sub, verdict, body, wide = false) =>
  `<div class="card${wide ? " wide" : ""}"><div class="head"><span class="t">${title}</span><span style="margin-left:auto">${mark(verdict)}</span></div>${body}</div>`;

async function openRun(id){
  openId = id;
  const row = await fetch(`/log/${id}`).then(r => r.json());
  const res = row.result, sg = (res && res.signals) || {};
  $("listPanel").hidden = true; $("run").hidden = false; window.scrollTo({ top: 0, behavior: "smooth" });
  const title = { pass: "Verified", step_up: "Needs a second check", block: "Blocked" }[row.decision] || row.decision;
  $("banner").className = "banner " + row.decision;
  $("banner").innerHTML = `<div><div class="big">${title}</div><ul>${(res?.reasons || []).map(r => `<li>${r}</li>`).join("")}</ul></div>
    <div class="meta">${row.first_name || ""}<br>${when(row.created_at)}${row.mode === "naive" ? "<br><span class=\"naive\">naïve app</span>" : ""}</div>`;
  const cards = $("cards"); cards.innerHTML = "";
  if(!res){
    cards.innerHTML = card("No detailed record", "scored before detailed records were kept", null, facts({
      "face": `${WORD[stateOf(row.face_verdict)]} · ${fmt(row.face_score, 3)}`, "document": row.doc_type, "capture": row.integrity_ok ? "clean" : flags(row.integrity_flags),
      "light": row.light_verdict ? `${WORD[stateOf(row.light_verdict)]} · ${fmt(row.light_score)}` : "not run", "phone move": row.motion_verdict ? `${WORD[stateOf(row.motion_verdict)]} · ${fmt(row.motion_score)}` : "not run",
      "profile turn": row.profile_verdict ? `${WORD[stateOf(row.profile_verdict)]} · ${fmt(row.profile_score)}` : "not run" }), true);
    return;
  }
  // 1 document
  const d = sg.id || {}, mrz = d.mrz;
  cards.innerHTML += card("Document", "photo of the ID, machine-readable zone", d.flags?.length ? "flagged" : (d.portrait_found ? "ok" : "review"),
    facts(mrz ? { "type": `${mrz.format || ""} ${d.doc_type || ""}`, "name": row.first_name, "born": mrz.birth_date, "valid until": mrz.expiry_date + (mrz.expired ? " — EXPIRED" : ""),
                  "check digits": Object.values(mrz.checks || {}).every(Boolean) ? "all valid" : "mismatch", "portrait found": d.portrait_found ? "yes" : "no", "issues": flags(d.flags) }
                : { "type": d.doc_type === "no_mrz" ? "no machine-readable zone" : d.doc_type, "portrait found": d.portrait_found ? "yes" : "no", "issues": flags(d.flags) }));
  // 2 face
  const f = sg.face || {};
  cards.innerHTML += card("Face match", "selfie vs the document portrait", f.verdict ?? "fail",
    `<div id="gFace"></div>` + facts({ "similarity": fmt(f.score, 3), "needed for a match": "≥ " + FACE_T.match, "result": f.verdict ? WORD[stateOf(f.verdict)] : (f.reason || "no face found") }));
  // 3 integrity
  const ig = sg.integrity || {};
  cards.innerHTML += card("Capture integrity", "real camera, real phone sensors?", ig.hard ? "fail" : (ig.ok ? "clean" : "flagged"),
    facts({ "virtual camera": ig.hard ? "DETECTED" : "none", "warnings": flags(ig.flags), "notes": flags(ig.info) }));
  // 6 profile (next to integrity to keep the grid tidy)
  const pr = sg.profile || {};
  cards.innerHTML += pr.enabled === false ? card("Profile turn", "turn to the side we picked", "off", `<div class="pp-empty">switched off</div>`)
    : card("Profile turn", "turn to the side we picked", pr.verdict,
      `<div id="gProf"></div>` + facts({ "side asked": pr.side, "score": fmt(pr.score), "turn towards the side": fmt(pr.peak_ok), "turn the wrong way": fmt(pr.peak_wrong), "note": pr.reason ? pr.reason.replace("_", " ") : null, "issues": pr.flags?.length ? flags(pr.flags) : null }));
  // 4 light
  const li = sg.light || {};
  cards.innerHTML += li.enabled === false ? card("Light", "screen colours reflected on the skin", "off", `<div class="pp-empty">switched off</div>`, true)
    : card("Light", "screen colours reflected on the skin", li.verdict,
      (li.opted_out ? `<div class="pp-empty">the user skipped the flashing step</div>` : `<div id="gLight"></div>`) +
      facts({ "colours matched": li.acc != null ? `${Math.round(li.acc * 6)} of 6` : null, "score": fmt(li.score), "match strength ρ": fmt(li.rho), "chance it's random": li.p != null ? (li.p < 0.001 ? "< 0.1 %" : (li.p * 100).toFixed(1) + " %") : null,
              "signal strength": li.snr != null ? fmt(li.snr, 1) : null, "camera delay": li.lag_ms != null ? li.lag_ms + " ms" : null, "issues": li.flags?.length ? flags(li.flags) : null }), true);
  // 5 motion
  const mo = sg.motion || {};
  cards.innerHTML += mo.enabled === false ? card("Phone move", "does the picture move like the gyroscope says?", "off", `<div class="pp-empty">switched off</div>`, true)
    : card("Phone move", "does the picture move like the gyroscope says?", mo.verdict,
      `<div class="legend"><span><i style="background:var(--video)"></i>what the camera saw</span><span><i style="background:var(--gyro)"></i>what the gyroscope felt</span><span>left: turning left/right · right: tipping up/down</span></div>
       <div class="two"><div id="gMoH"></div><div id="gMoV"></div></div>` +
      facts({ "score": fmt(mo.score), "agreement left/right": fmt(mo.r_yaw), "agreement up/down": fmt(mo.r_pitch), "camera delay": mo.lag_ms != null ? mo.lag_ms + " ms" : null,
              "phone movement": mo.gyro_rms_dps != null ? fmt(mo.gyro_rms_dps, 0) + " °/s" : null, "note": mo.reason, "issues": mo.flags?.length ? flags(mo.flags) : null }), true);
  // charts
  P.gauge($("gFace"), f.score, [{ v: FACE_T.low, label: "unclear " + FACE_T.low, color: "var(--warn)" }, { v: FACE_T.match, label: "match " + FACE_T.match, color: "var(--pass)" }],
          { colorOf: v => v >= FACE_T.match ? "var(--pass)" : v >= FACE_T.low ? "var(--warn)" : "var(--fail)" });
  if($("gLight")) P.lightPanel($("gLight"), li);
  if($("gMoH")) P.motionPanel($("gMoH"), $("gMoV"), mo);
  if($("gProf")) P.profilePanel($("gProf"), pr);
}
$("back").onclick = () => { openId = null; $("run").hidden = true; $("listPanel").hidden = false; };

async function poll(){
  try {
    const d = await fetch("/log?limit=200").then(r => r.json());
    rows = d.rows || [];
    $("empty").hidden = rows.length > 0; showTab();
    if(rows.length !== lastN){ lastN = rows.length; renderSummary(d.stats || {}); renderRows(); }
  } catch(_){}
}
poll(); setInterval(poll, 3000);

// ---- Cast phone: show the iPhone screen in a frame on the right while screen-sharing this page.
// The phone itself can't stream its screen to a browser; the Mac captures it instead:
//   1. USB + QuickTime (File → New Movie Recording → camera: iPhone) or AirPlay → this Mac.
//   2. Cast: first try the iPhone as a plain video device (Chrome lists a USB iPhone once QuickTime
//      has opened it), else window capture — pick the QuickTime / AirPlay window.
let castStream = null;
async function startCast(){
  $("phoneMsg").hidden = true;
  try {
    let stream = null;
    try {
      const probe = await navigator.mediaDevices.getUserMedia({ video: true });   // unlocks device labels
      probe.getTracks().forEach(t => t.stop());
      const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput" && /iphone|ipad/i.test(d.label));
      if(cams.length) stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: cams[0].deviceId }, width: { ideal: 1170 }, height: { ideal: 2532 } } });
    } catch(_){}
    if(!stream) stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false, selfBrowserSurface: "exclude" });
    castStream = stream;
    $("phoneVideo").srcObject = stream;
    stream.getVideoTracks()[0].addEventListener("ended", stopCast);
    startCropLoop();
    document.body.classList.add("casting"); $("phone").hidden = false; $("cast").classList.add("on"); $("cast").textContent = "Casting";
  } catch(e){
    document.body.classList.add("casting"); $("phone").hidden = false;
    $("phoneMsg").hidden = false; $("phoneMsg").textContent = "No phone feed. Plug the iPhone in by USB and open it in QuickTime (New Movie Recording → camera: iPhone), or AirPlay it to this Mac, then Cast again and pick that window.";
  }
}
// Auto-crop: the AirPlay / QuickTime window is a phone in the middle of a black surface. Every
// ~0.7 s we find the bounding box of the non-black pixels on a 96 px thumbnail and draw only that
// region into the frame (box kept when the phone itself goes black for a moment).
let cropRaf = null, cropBox = null, cropT = 0;
const _probe = document.createElement("canvas"), _pctx = _probe.getContext("2d", { willReadFrequently: true });
function findPhoneBox(video){
  const W = 96, H = Math.max(8, Math.round(video.videoHeight * W / video.videoWidth));
  _probe.width = W; _probe.height = H; _pctx.drawImage(video, 0, 0, W, H);
  const d = _pctx.getImageData(0, 0, W, H).data;
  const col = new Uint8Array(W), row = new Uint8Array(H);
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){ const i = (y * W + x) * 4; if(d[i] + d[i+1] + d[i+2] > 60){ col[x] = 1; row[y] = 1; } }
  let x0 = col.indexOf(1), x1 = col.lastIndexOf(1), y0 = row.indexOf(1), y1 = row.lastIndexOf(1);
  if(x0 < 0 || x1 - x0 < 8 || y1 - y0 < 8) return null;
  const sx = video.videoWidth / W, sy = video.videoHeight / H;
  return { x: Math.max(0, (x0 - 0.5) * sx), y: Math.max(0, (y0 - 0.5) * sy), w: Math.min(video.videoWidth, (x1 - x0 + 2) * sx), h: Math.min(video.videoHeight, (y1 - y0 + 2) * sy) };
}
function startCropLoop(){
  const v = $("phoneVideo"), c = $("phoneCanvas"), ctx = c.getContext("2d");
  const draw = () => {
    if(!castStream) return;
    if(v.videoWidth){
      const now = performance.now();
      if(now - cropT > 700){ cropT = now; const b = findPhoneBox(v); if(b) cropBox = b; }
      const b = cropBox || { x: 0, y: 0, w: v.videoWidth, h: v.videoHeight };
      const cw = Math.round(Math.min(900, b.w)), ch = Math.round(cw * b.h / b.w);
      if(c.width !== cw || c.height !== ch){ c.width = cw; c.height = ch; }
      ctx.drawImage(v, b.x, b.y, b.w, b.h, 0, 0, cw, ch);
    }
    cropRaf = requestAnimationFrame(draw);
  };
  cancelAnimationFrame(cropRaf); draw();
}
function stopCast(){
  cancelAnimationFrame(cropRaf); cropBox = null;
  if(castStream) castStream.getTracks().forEach(t => t.stop()); castStream = null;
  $("phoneVideo").srcObject = null; $("phone").hidden = true; document.body.classList.remove("casting");
  $("cast").classList.remove("on"); $("cast").textContent = "Cast phone";
}
$("cast").onclick = () => castStream ? stopCast() : startCast();
$("castStop").onclick = stopCast;
</script>
