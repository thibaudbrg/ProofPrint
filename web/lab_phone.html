<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-4 lab · phone</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#FAF9F6;color:#1C1A17;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
  .app{width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;gap:12px;padding:16px 18px calc(16px + env(safe-area-inset-bottom))}
  h1{font-size:18px;margin:0}
  .sub{color:#6C6860;font-size:13px;margin:0}
  .viewport{position:relative;width:100%;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#0c0c0d}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .hud{position:absolute;left:10px;right:10px;bottom:10px;font-family:ui-monospace,monospace;font-size:12px;color:#fff;
       background:rgba(0,0,0,.45);border-radius:10px;padding:8px 10px;line-height:1.5;white-space:pre}
  .bar{position:absolute;left:10px;right:10px;top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#fff}
  .row{display:flex;gap:8px;align-items:center}
  input,select{font:inherit;padding:10px 12px;border:1px solid #EAE6DE;border-radius:10px;background:#fff;min-width:0}
  input{flex:1}
  button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:#C96442;color:#fff;cursor:pointer}
  button:disabled{opacity:.4}
  .ghost{background:transparent;color:#1C1A17;border:1px solid #EAE6DE}
  .res{font-family:ui-monospace,monospace;font-size:12.5px;background:#fff;border:1px solid #EAE6DE;border-radius:12px;padding:10px 12px;white-space:pre-wrap;line-height:1.5}
  .pass{color:#1E7A47}.review,.insufficient,.absent{color:#B26B0C}.fail{color:#C13B2C}
</style>
</head>
<body>
<div class="app">
  <div><h1>Check-4 lab · tilt burst only</h1><p class="sub">No ID, no face match, no profile turn. Results appear live on the laptop at <code>/lab</code>.</p></div>

  <div class="viewport">
    <video id="v" playsinline muted autoplay></video>
    <div class="bar" id="bar" hidden><i></i></div>
    <div class="hud" id="hud">tap Start</div>
  </div>

  <div class="row">
    <input id="label" placeholder="label: genuine / on stand / head only / OBS…" value="genuine">
    <select id="dur"><option value="2000">2 s</option><option value="3000" selected>3 s</option><option value="4000">4 s</option></select>
  </div>
  <div class="row">
    <button class="ghost" id="start">Start camera</button>
    <button id="rec" disabled>Record tilt</button>
  </div>
  <div class="res" id="res" hidden></div>
</div>

<script>
const $ = id => document.getElementById(id);
const FRAME_MS = 80, FRAME_W = 320;         // identical to the production burst
let stream = null, recording = false, motion = [], live = {beta:0,gamma:0,alpha:0,n:0};

function onMotion(e){
  const r = e.rotationRate; if(!r || r.alpha==null) return;
  live = {beta:r.beta, gamma:r.gamma, alpha:r.alpha, n:live.n+1};
  if(!recording) return;
  const a = e.acceleration || {};
  // rotationRate per spec: alpha = about X (pitch), beta = about Y (yaw), gamma = about Z (roll)
  motion.push({ t:performance.now(), rx:r.alpha, ry:r.beta, rz:r.gamma, ax:a.x, ay:a.y, az:a.z });
}
setInterval(() => { if(!recording) $("hud").textContent =
  `gyro  pitch(α) ${live.alpha.toFixed(1).padStart(7)}  yaw(β) ${live.beta.toFixed(1).padStart(7)}  roll(γ) ${live.gamma.toFixed(1).padStart(7)} deg/s\nsensor events: ${live.n}${live.n===0?"  ← no motion events yet (iOS: allow motion)":""}`; }, 200);

$("start").onclick = async () => {
  if (typeof DeviceMotionEvent?.requestPermission === "function"){ try{ await DeviceMotionEvent.requestPermission(); }catch(_){} }
  window.addEventListener("devicemotion", onMotion);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:960}, frameRate:{ideal:30,max:30} } });
    $("v").srcObject = stream; $("rec").disabled = false; $("start").textContent = "Camera on";
  } catch(e){ $("hud").textContent = "camera error: " + e.message; }
};

$("rec").onclick = async () => {
  if(recording) return;
  const v = $("v"), dur = +$("dur").value, hud = $("hud"), bar = $("bar"), fill = bar.querySelector("i");
  const c = document.createElement("canvas"); const vw = v.videoWidth||640, vh = v.videoHeight||480;
  c.width = FRAME_W; c.height = Math.round(vh*FRAME_W/vw); const ctx = c.getContext("2d");
  const frames = [], metaFrames = [], pending = [];
  motion = []; recording = true; $("rec").disabled = true; $("res").hidden = true; bar.hidden = false;
  const t0 = performance.now(); let i = 0;
  await new Promise(done => {
    const tick = () => {
      const now = performance.now();
      if(now - t0 >= dur){ Promise.all(pending).then(done); return; }
      const name = String(++i).padStart(4,"0") + ".jpg";
      ctx.drawImage(v, 0, 0, c.width, c.height);            // raw (unmirrored) pixels, like production
      metaFrames.push({ file:name, t:now });
      pending.push(new Promise(r => c.toBlob(b => { frames.push({name, blob:b}); r(); }, "image/jpeg", 0.72)));
      fill.style.width = ((now-t0)/dur*100).toFixed(0) + "%";
      hud.textContent = `RECORDING  ${((dur-(now-t0))/1000).toFixed(1)} s\ntilt the PHONE left/right, up/down — not your head\nframes ${i}  samples ${motion.length}`;
      setTimeout(tick, FRAME_MS);
    };
    tick();
  });
  recording = false; bar.hidden = true;
  hud.textContent = `uploading ${frames.length} frames + ${motion.length} samples…`;
  const fd = new FormData();
  for(const f of frames) fd.append("frames", f.blob, f.name);
  fd.append("meta", JSON.stringify({ frames:metaFrames, motion, label:$("label").value,
    claimsMobile:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent),
    cameraLabel: stream ? (stream.getVideoTracks()[0].label||"") : "" }));
  try {
    const r = await fetch("/lab/motion", {method:"POST", body:fd}).then(x=>x.json());
    const o = r.official || {}, s = (r.detail||{}).stats || {};
    $("res").hidden = false;
    $("res").innerHTML = `run #${r.id} · <b class="${o.verdict}">${o.verdict}</b> · score ${o.score ?? "-"} · lag ${o.lag_ms ?? "-"} ms\n` +
      `r_yaw ${s.r_yaw ?? "-"}  r_pitch ${s.r_pitch ?? "-"}  method ${s.flow_method ?? "-"}\n` +
      `gyro_rms ${s.gyro_rms_dps ?? "-"} deg/s  flow_rms ${s.flow_rms_pxs ?? "-"} px/s${o.reason?`\nreason: ${o.reason}`:""}${(o.flags||[]).length?`\nflags: ${o.flags.join(", ")}`:""}\n→ details on the laptop dashboard`;
    hud.textContent = `done · run #${r.id} ${o.verdict}`;
  } catch(e){ $("res").hidden = false; $("res").textContent = "upload failed: " + e.message; }
  $("rec").disabled = false;
};
</script>
</body>
</html>
